syntax = "proto3";

package deadlock.v1;

import "google/api/annotations.proto";

option go_package = "github.com/obsessed-gopher/deadlock/gen/go/deadlock/v1;deadlockv1";

// StatsService serves per-player and per-match analytics built from Valve
// match metadata. REST mapping is provided by grpc-gateway.
service StatsService {
  // Player profile and sync state.
  rpc GetPlayer(GetPlayerRequest) returns (Player) {
    option (google.api.http) = {get: "/v1/players/{account_id}"};
  }

  // Player's match history, newest first.
  rpc ListPlayerMatches(ListPlayerMatchesRequest) returns (ListPlayerMatchesResponse) {
    option (google.api.http) = {get: "/v1/players/{account_id}/matches"};
  }

  // Per-hero totals of a player over all synced matches, most played first.
  rpc ListPlayerHeroStats(ListPlayerHeroStatsRequest) returns (ListPlayerHeroStatsResponse) {
    option (google.api.http) = {get: "/v1/players/{account_id}/heroes"};
  }

  // Compact facts of every match of a player, oldest first: the input of
  // client-side trends (progress, development speed, sessions, records).
  rpc ListPlayerMatchFacts(ListPlayerMatchFactsRequest) returns (ListPlayerMatchFactsResponse) {
    option (google.api.http) = {get: "/v1/players/{account_id}/facts"};
  }

  // People and heroes met in a player's matches with metadata: frequent
  // allies and opponents, heroes alongside and against, party sizes.
  rpc ListPlayerPeers(ListPlayerPeersRequest) returns (ListPlayerPeersResponse) {
    option (google.api.http) = {get: "/v1/players/{account_id}/peers"};
  }

  // Pull fresh match history and queue metadata downloads for new matches.
  rpc SyncPlayer(SyncPlayerRequest) returns (SyncPlayerResponse) {
    option (google.api.http) = {
      post: "/v1/players/{account_id}:sync"
      body: "*"
    };
  }

  // Every stored match with metadata the player took part in, oldest first:
  // works for anyone seen in a match, tracked or not (profiles of other
  // players, comparisons).
  rpc ListSeenMatches(ListSeenMatchesRequest) returns (ListSeenMatchesResponse) {
    option (google.api.http) = {get: "/v1/players/{account_id}/seen"};
  }

  // Steam names and avatars of many accounts at once (at most 1000). Only
  // accounts with a known profile are returned; the rest are not fetched yet
  // or have none.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse) {
    option (google.api.http) = {get: "/v1/profiles"};
  }

  // Account id behind a Steam custom profile URL
  // (steamcommunity.com/id/<vanity>). Asks Steam on every call.
  rpc ResolveSteamVanity(ResolveSteamVanityRequest) returns (ResolveSteamVanityResponse) {
    option (google.api.http) = {get: "/v1/steam/vanity/{vanity}"};
  }

  // Scoreboard of all players in a match.
  rpc GetMatch(GetMatchRequest) returns (Match) {
    option (google.api.http) = {get: "/v1/matches/{match_id}"};
  }

  // Detailed breakdown of one player in one match: timelines, items, deaths.
  rpc GetPlayerMatch(GetPlayerMatchRequest) returns (PlayerMatch) {
    option (google.api.http) = {get: "/v1/matches/{match_id}/players/{account_id}"};
  }

  // Static game data: hero and item/ability names, slots, tiers.
  // Changes only with game patches; clients should cache it.
  rpc GetGameData(GetGameDataRequest) returns (GameData) {
    option (google.api.http) = {get: "/v1/gamedata"};
  }
}

// ---------- game data ----------

message GetGameDataRequest {}

message GameData {
  string game_version = 1;
  repeated Hero heroes = 2;
  repeated Ability abilities = 3;
}

message Hero {
  uint32 id = 1;
  string key = 2;             // internal name, e.g. "hero_haze"
  string name = 3;
  string name_ru = 4;
  string type = 5;            // e.g. "assassin"
  bool playable = 6;          // released and enabled
}

message Ability {
  uint32 id = 1;              // value of item_id in match data
  string key = 2;             // e.g. "upgrade_rapid_rounds"
  string name = 3;
  string name_ru = 4;
  string type = 5;            // item | signature | weapon | innate | ...
  string slot = 6;            // weapon | vitality | spirit (items only)
  uint32 tier = 7;            // 1..5 (items only)
}

// ---------- enums ----------

enum MetaStatus {
  META_STATUS_UNSPECIFIED = 0;
  META_STATUS_PENDING = 1;   // queued for download
  META_STATUS_OK = 2;        // parsed and stored
  META_STATUS_EXPIRED = 3;   // Valve no longer hosts the replay
  META_STATUS_FAILED = 4;    // gave up after retries
}

enum SyncState {
  SYNC_STATE_UNSPECIFIED = 0;
  SYNC_STATE_NEVER = 1;
  SYNC_STATE_RUNNING = 2;
  SYNC_STATE_IDLE = 3;
  SYNC_STATE_ERROR = 4;
}

// ---------- player ----------

message GetPlayerRequest {
  // Account id or SteamID64. Widened from uint32, which is wire-compatible.
  uint64 account_id = 1;
}

message Player {
  uint32 account_id = 1;
  SyncState sync_state = 2;
  string sync_error = 3;
  int64 last_synced_at = 4;   // unix seconds, 0 if never
  uint32 matches_total = 5;
  uint32 matches_with_meta = 6;
  uint32 matches_pending = 7;
  uint32 wins = 8;
}

// Sort key of ListPlayerMatches. Ties are broken by match_id.
enum MatchSort {
  MATCH_SORT_UNSPECIFIED = 0; // same as START_TIME
  MATCH_SORT_START_TIME = 1;
  MATCH_SORT_DURATION = 2;
  MATCH_SORT_KILLS = 3;
  MATCH_SORT_DEATHS = 4;
  MATCH_SORT_ASSISTS = 5;
  MATCH_SORT_NET_WORTH = 6;
  MATCH_SORT_LAST_HITS = 7;
  MATCH_SORT_HERO_LEVEL = 8;
}

// What players call the mode: the queue a match was played in. Derived from
// Valve's game mode and match mode (ranked is a match mode of the normal game
// mode, so filtering by game_mode alone mixes ranked into normal).
enum MatchQueue {
  MATCH_QUEUE_UNSPECIFIED = 0;  // any
  MATCH_QUEUE_NORMAL = 1;       // normal game mode, unranked (or placement)
  MATCH_QUEUE_RANKED = 2;       // normal game mode, ranked
  MATCH_QUEUE_STREET_BRAWL = 3;
  MATCH_QUEUE_OTHER = 4;        // hero labs, bots, private lobbies, tests
}

enum MatchResult {
  MATCH_RESULT_UNSPECIFIED = 0; // any
  MATCH_RESULT_WIN = 1;
  MATCH_RESULT_LOSS = 2;
}

message ListPlayerMatchesRequest {
  // Account id or SteamID64. Widened from uint32, which is wire-compatible.
  uint64 account_id = 1;
  uint32 page_size = 2;       // default 50, max 200
  string page_token = 3;      // opaque, from previous response
  uint32 hero_id = 4;         // optional filter
  MatchSort sort = 5;
  bool ascending = 6;         // default: largest / newest first
  MatchResult result = 7;     // optional filter
  int32 game_mode = 8;        // optional filter, 0 = any
  MetaStatus meta_status = 9; // optional filter, UNSPECIFIED = any
  MatchQueue queue = 10;      // optional filter, UNSPECIFIED = any
}

message ListPlayerMatchesResponse {
  repeated PlayerMatchRow matches = 1;
  string next_page_token = 2;
  uint32 total = 3;           // rows matching the filters, all pages
}

message PlayerMatchRow {
  uint64 match_id = 1;
  int64 start_time = 2;       // unix seconds
  uint32 duration_s = 3;
  int32 game_mode = 4;
  int32 match_mode = 5;
  uint32 hero_id = 6;
  int32 team = 7;
  bool won = 8;
  uint32 kills = 9;
  uint32 deaths = 10;
  uint32 assists = 11;
  uint32 net_worth = 12;
  uint32 last_hits = 13;
  uint32 denies = 14;
  uint32 hero_level = 15;
  MetaStatus meta_status = 16;
}

message ListPlayerHeroStatsRequest {
  // Account id or SteamID64.
  uint64 account_id = 1;
}

message ListPlayerHeroStatsResponse {
  repeated HeroStats heroes = 1;
}

// Totals over the player's matches on one hero; averages are total / matches.
message HeroStats {
  uint32 hero_id = 1;
  uint32 matches = 2;
  uint32 wins = 3;
  uint32 kills = 4;
  uint32 deaths = 5;
  uint32 assists = 6;
  uint32 net_worth = 7;
  uint32 last_hits = 8;
  uint32 duration_s = 9;      // total time played
  int64 last_played = 10;     // unix seconds, start of the latest match
}

message ListPlayerMatchFactsRequest {
  // Account id or SteamID64.
  uint64 account_id = 1;
}

message ListPlayerMatchFactsResponse {
  repeated MatchFacts matches = 1;   // oldest first
  repeated uint32 soul_marks_s = 2;  // game times of MatchFacts.souls_at
  repeated uint32 soul_targets = 3;  // soul totals of MatchFacts.time_to_souls_s
}

message MatchFacts {
  uint64 match_id = 1;
  int64 start_time = 2;       // unix seconds
  uint32 duration_s = 3;
  int32 game_mode = 4;
  int32 match_mode = 5;
  uint32 hero_id = 6;
  bool won = 7;
  uint32 kills = 8;
  uint32 deaths = 9;
  uint32 assists = 10;
  uint32 net_worth = 11;
  uint32 last_hits = 12;

  // The rest comes from metadata: zero when has_meta is false.
  bool has_meta = 13;
  uint32 player_damage = 14;
  uint32 player_healing = 15;
  // Net worth at each soul_marks_s; 0 when the match ended earlier.
  repeated uint32 souls_at = 16;
  // Seconds to reach each soul_targets; 0 when never reached.
  repeated uint32 time_to_souls_s = 17;
  SoulSources souls_from = 18;
  // Average rank badge of both teams (tier * 10 + subtier); 0 = not reported.
  // Valve writes no per-player rank into metadata.
  uint32 lobby_badge = 19;
}

// Souls earned by source over the whole match.
message SoulSources {
  uint32 heroes = 1;
  uint32 lane_creeps = 2;
  uint32 neutrals = 3;
  uint32 bosses = 4;
  uint32 treasure = 5;        // urns, crates
}

message ListPlayerPeersRequest {
  // Account id or SteamID64. Any player seen in a match with metadata works,
  // tracked or not.
  uint64 account_id = 1;
}

message ListPlayerPeersResponse {
  // Matches with metadata (rosters known) and the player's wins in them:
  // the base for "with X" vs "without X".
  uint32 matches = 1;
  uint32 wins = 2;
  // People met at least peer_min_matches times, most matches first.
  repeated Peer allies = 3;
  repeated Peer enemies = 4;
  // Every hero seen alongside or against the player.
  repeated HeroMatchup heroes = 5;
  // Matches by the number of friends (allies with at least
  // friend_min_matches shared matches) on the player's team.
  repeated PartySize party_sizes = 6;
  uint32 peer_min_matches = 7;
  uint32 friend_min_matches = 8;
}

// Another player as met by the requested one. Wins are the requested
// player's wins in those matches.
message Peer {
  uint64 account_id = 1;
  uint32 matches = 2;
  uint32 wins = 3;
  int64 first_played = 4;     // unix seconds
  int64 last_played = 5;      // unix seconds
  uint64 last_match_id = 6;
  uint32 top_hero_id = 7;     // their most played hero in these matches
  // In the requested player's Steam friend list (known for tracked players).
  bool steam_friend = 8;
}

// A hero seen alongside (on the player's team) or against the player.
message HeroMatchup {
  uint32 hero_id = 1;
  uint32 with_matches = 2;
  uint32 with_wins = 3;
  uint32 against_matches = 4;
  uint32 against_wins = 5;
}

message PartySize {
  uint32 friends = 1;
  uint32 matches = 2;
  uint32 wins = 3;
}

message SyncPlayerRequest {
  // Account id or SteamID64. Widened from uint32, which is wire-compatible.
  uint64 account_id = 1;
}

message SyncPlayerResponse {
  uint32 new_matches = 1;
  uint32 queued_meta = 2;
}

// ---------- match ----------

message ListSeenMatchesRequest {
  // Account id or SteamID64.
  uint64 account_id = 1;
}

message ListSeenMatchesResponse {
  repeated SeenMatch matches = 1;  // oldest first
}

// One player's line in a stored match, from metadata.
message SeenMatch {
  uint64 match_id = 1;
  int64 start_time = 2;       // unix seconds
  uint32 duration_s = 3;
  int32 game_mode = 4;
  int32 match_mode = 5;
  uint32 hero_id = 6;
  uint32 team = 7;
  bool won = 8;
  uint32 kills = 9;
  uint32 deaths = 10;
  uint32 assists = 11;
  uint32 net_worth = 12;
  uint32 last_hits = 13;
  uint32 player_damage = 14;
  uint32 player_healing = 15;
  uint32 level = 16;
}

message ListProfilesRequest {
  // Account ids or SteamID64s; repeat the query parameter:
  // ?account_ids=1&account_ids=2.
  repeated uint64 account_ids = 1;
}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

// Public Steam profile, refreshed in the background at most weekly.
message Profile {
  uint32 account_id = 1;
  string persona_name = 2;
  string profile_url = 3;
  string avatar = 4;          // 32 px
  string avatar_medium = 5;   // 64 px
  string avatar_full = 6;     // 184 px
  string country = 7;         // ISO 3166-1 alpha-2, may be empty
}

message ResolveSteamVanityRequest {
  string vanity = 1;          // the <vanity> of steamcommunity.com/id/<vanity>
}

message ResolveSteamVanityResponse {
  uint32 account_id = 1;
}

message GetMatchRequest {
  uint64 match_id = 1;
}

message Match {
  uint64 match_id = 1;
  int64 start_time = 2;
  uint32 duration_s = 3;
  int32 game_mode = 4;
  int32 match_mode = 5;
  int32 winning_team = 6;
  MetaStatus meta_status = 7;
  repeated MatchPlayer players = 8;
}

message MatchPlayer {
  uint32 slot = 1;
  uint32 account_id = 2;
  int32 team = 3;
  uint32 hero_id = 4;
  uint32 lane = 5;
  uint32 kills = 6;
  uint32 deaths = 7;
  uint32 assists = 8;
  uint32 net_worth = 9;
  uint32 last_hits = 10;
  uint32 denies = 11;
  uint32 level = 12;
  uint32 player_damage = 13;
  uint32 player_healing = 14;
  uint32 abandon_time_s = 15;
}

// ---------- player in match ----------

message GetPlayerMatchRequest {
  uint64 match_id = 1;
  // Account id or SteamID64. Widened from uint32, which is wire-compatible.
  uint64 account_id = 2;
}

message PlayerMatch {
  Match match = 1;            // scoreboard, so one call renders the page
  uint32 slot = 2;
  repeated StatSnapshot timeline = 3;
  repeated ItemEvent items = 4;
  repeated Death deaths = 5;
  // Net worth timelines of every player, keyed by slot, for comparison charts.
  repeated SlotTimeline net_worth_by_slot = 6;
}

message StatSnapshot {
  uint32 t = 1;               // game time, seconds
  uint32 net_worth = 2;
  uint32 level = 3;
  uint32 kills = 4;
  uint32 deaths = 5;
  uint32 assists = 6;
  uint32 creep_kills = 7;
  uint32 neutral_kills = 8;
  uint32 denies = 9;
  uint32 player_damage = 10;
  uint32 player_damage_taken = 11;
  uint32 player_healing = 12;
  uint32 self_healing = 13;
  uint32 gold_player = 14;    // souls from hero kills
  uint32 gold_lane_creep = 15;
  uint32 gold_neutral_creep = 16;
  uint32 gold_boss = 17;
  uint32 gold_treasure = 18;
  uint32 gold_death_loss = 19;
  uint32 shots_hit = 20;
  uint32 shots_missed = 21;
}

message ItemEvent {
  uint32 t = 1;
  uint32 item_id = 2;
  uint32 sold_t = 3;          // 0 if kept
  uint32 upgrade_id = 4;
  uint32 flags = 5;
}

message Death {
  uint32 t = 1;
  uint32 killer_slot = 2;
  Vec3 pos = 3;
  Vec3 killer_pos = 4;
  uint32 respawn_s = 5;
  float time_to_kill_s = 6;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message SlotTimeline {
  uint32 slot = 1;
  repeated TimePoint points = 2;
}

message TimePoint {
  uint32 t = 1;
  uint32 v = 2;
}
