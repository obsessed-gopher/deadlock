name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: deadlock
          POSTGRES_PASSWORD: deadlock
          POSTGRES_DB: deadlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deadlock -d deadlock"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://deadlock:deadlock@localhost:5432/deadlock?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools/dev/main.go') }}
      # tidy, format, build, lint, unit tests with -race
      - run: go run ./tools/dev ci
      # integration tests against the postgres service above
      - run: go run ./tools/dev test-db
      - run: go run ./tools/dev vuln
