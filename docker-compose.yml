services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: deadlock
      POSTGRES_DB: deadlock
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlock -d deadlock"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: .
    environment:
      DATABASE_URL: postgres://deadlock:deadlock@postgres:5432/deadlock?sslmode=disable
      SYNC_ACCOUNTS: ${SYNC_ACCOUNTS:-}
      SYNC_EVERY: ${SYNC_EVERY:-30m}
      META_INTERVAL: ${META_INTERVAL:-1.5s}
    ports:
      - "127.0.0.1:8080:8080" # REST gateway
      - "127.0.0.1:9090:9090" # gRPC
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
